{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注册 - 觅途行</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=20260820-fav-top-right">
</head>
<body>
    <main class="app-shell">
        <div class="auth-container">
            <div class="panel-card">
                <div class="brand-lockup">
                    <span class="brand-mark">觅</span>
                    <div>
                        <strong>觅途行</strong>
                        <span>MiTuXing</span>
                    </div>
                </div>
                <div class="panel-heading">
                    <p>创建账号 · Get Started</p>
                    <h1>用户注册</h1>
                </div>
                {% if errors %}
                    <div class="alert danger-list">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="alert-icon"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <div class="error-container">
                            {% for item in errors %}
                                <p>{{ item }}</p>
                            {% endfor %}
                        </div>
                    </div>
                {% endif %}
                <form class="auth-form" method="post" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    <div class="input-group">
                        <input type="text" name="username" id="username" value="{{ username }}" autocomplete="username" placeholder=" " required>
                        <label for="username">用户名</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="password" autocomplete="new-password" placeholder=" " required>
                        <label for="password">密码</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password_confirm" id="password_confirm" autocomplete="new-password" placeholder=" " required>
                        <label for="password_confirm">确认密码</label>
                    </div>
                    <button class="primary-button" type="submit">
                        <span>注册账号</span>
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="btn-arrow"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>
                <p class="switch-link">已有账号？<a href="{% url 'accounts:login' %}">去登录</a></p>
            </div>
        </div>
    </main>
</body>
</html>
